<title>EigenDEXplore</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #fafaf9; --muted: #a8a29e; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 0 16px; }
  main { text-align: center; }
  h1 { font-size: clamp(2rem, 6vw, 3.25rem); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 .5rem; }
  p { color: var(--muted); font-size: 1.1rem; margin: 0; }
</style>
